<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Marks Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="card">

    <div class="card-header">
      <h1>&#127891; Student Marks Calculator</h1>
      <p>Enter marks out of 100 for each subject</p>
    </div>

    <!-- Student Name -->
    <div class="field">
      <label for="studentName">Student Name</label>
      <input
        type="text"
        id="studentName"
        placeholder="e.g. John Smith"
        autocomplete="off"
      />
    </div>

    <hr class="divider" />

    <!-- Subject Marks -->
    <p class="section-label">Subject Marks (0 &ndash; 100)</p>

    <div class="subjects-grid">
      <div class="field">
        <label for="s1">Subject 1</label>
        <input type="number" id="s1" min="0" max="100" placeholder="0 – 100" />
      </div>
      <div class="field">
        <label for="s2">Subject 2</label>
        <input type="number" id="s2" min="0" max="100" placeholder="0 – 100" />
      </div>
      <div class="field">
        <label for="s3">Subject 3</label>
        <input type="number" id="s3" min="0" max="100" placeholder="0 – 100" />
      </div>
      <div class="field">
        <label for="s4">Subject 4</label>
        <input type="number" id="s4" min="0" max="100" placeholder="0 – 100" />
      </div>
      <div class="field full-width">
        <label for="s5">Subject 5</label>
        <input type="number" id="s5" min="0" max="100" placeholder="0 – 100" />
      </div>
    </div>

    <!-- Error Message -->
    <p class="error-msg" id="errorMsg" aria-live="polite"></p>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn-primary" id="calcBtn">Calculate Result</button>
      <button class="btn-secondary" id="clearBtn">Clear</button>
    </div>

    <!-- Result Panel -->
    <div class="result-box" id="resultBox" aria-live="polite">
      <h2>&#128202; Result Summary</h2>
      <div class="result-row">
        <span>Student</span>
        <span class="result-val" id="resName"></span>
      </div>
      <div class="result-row">
        <span>Total Marks</span>
        <span class="result-val" id="resTotal"></span>
      </div>
      <div class="result-row">
        <span>Percentage</span>
        <span class="result-val" id="resPercent"></span>
      </div>
      <div class="result-row">
        <span>Grade</span>
        <span class="grade-badge" id="resGrade"></span>
      </div>
    </div>

  </div><!-- /.card -->

  <script src="js/script.js"></script>
</body>
</html>
